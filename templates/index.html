<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPredict | AI Crop Yield Dashboard</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                        serif: ['Cormorant Garamond', 'serif'],
                    },
                    colors: {
                        agri: {
                            green: '#2D5A27',
                            earth: '#5A5A40',
                            cream: '#F5F5F0',
                            gold: '#D4A373',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F5F5F0;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        window.FLASK_MESSAGE = "{{ message if message else '' }}";
    </script>
    <script type="text/babel">
        /* {% raw %} */
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion || { motion: { div: (props) => <div {...props} /> }, AnimatePresence: ({ children }) => children };

        // Icons
        const Icons = {
            Sprout: () => <i data-lucide="sprout"></i>,
            Wheat: () => <i data-lucide="wheat"></i>,
            Droplets: () => <i data-lucide="droplets"></i>,
            Thermometer: () => <i data-lucide="thermometer"></i>,
            MapPin: () => <i data-lucide="map-pin"></i>,
            Layers: () => <i data-lucide="layers"></i>,
            CheckCircle2: () => <i data-lucide="check-circle-2"></i>,
            AlertCircle: () => <i data-lucide="alert-circle"></i>,
            ArrowRight: () => <i data-lucide="arrow-right"></i>,
            Zap: () => <i data-lucide="zap"></i>,
            ShieldCheck: () => <i data-lucide="shield-check"></i>,
            Globe: () => <i data-lucide="globe"></i>,
            LogOut: () => <i data-lucide="log-out"></i>,
            User: () => <i data-lucide="user"></i>,
            BarChart3: () => <i data-lucide="bar-chart-3"></i>,
            HomeIcon: () => <i data-lucide="home"></i>,
            Clock: () => <i data-lucide="clock"></i>,
            Activity: () => <i data-lucide="activity"></i>,
            Key: () => <i data-lucide="key"></i>,
            Mail: () => <i data-lucide="mail"></i>,
            Lock: () => <i data-lucide="lock"></i>,
            RefreshCw: () => <i data-lucide="refresh-cw"></i>
        };

        const CROP_TYPES = ["Wheat", "Rice", "Maize", "Barley", "Soybean"];
        const SOIL_TYPES = ["Alluvial", "Black", "Red", "Laterite", "Sandy"];
        const REGIONS = ["North", "South", "East", "West", "Central"];

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [page, setPage] = useState(localStorage.getItem('agri_page') || 'home');
            const [view, setView] = useState(localStorage.getItem('agri_view') || 'dashboard');

            useEffect(() => {
                localStorage.setItem('agri_page', page);
                localStorage.setItem('agri_view', view);
            }, [page, view]);

            useEffect(() => {
                checkAuthStatus();
            }, []);

            useEffect(() => {
                lucide.createIcons();
            }, [user, page, view]);

            const checkAuthStatus = async () => {
                try {
                    const res = await fetch('/auth/status');
                    const data = await res.json();
                    if (data.logged_in) {
                        setUser(data.user);
                    } else {
                        const savedPage = localStorage.getItem('agri_page');
                        if (savedPage && savedPage !== 'home') {
                            setView('auth');
                            setPage('home');
                        }
                    }
                } catch (e) { console.error(e); }
                finally { setLoading(false); }
            };

            const handleLogout = async () => {
                await fetch('/auth/signout');
                setUser(null);
                localStorage.removeItem('agri_page');
                localStorage.removeItem('agri_view');
                setView('auth');
                setPage('home');
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-agri-cream">
                    <div className="text-agri-green animate-bounce"><div className="w-12 h-12"><Icons.Sprout /></div></div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-agri-green text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div onClick={() => { setPage('home'); setView('dashboard'); }} className="flex items-center space-x-2 cursor-pointer">
                                    <div className="w-8 h-8 text-agri-gold"><Icons.Sprout /></div>
                                    <span className="text-xl font-serif font-bold tracking-tight">AgriPredict</span>
                                </div>

                                <nav className="hidden md:flex space-x-8">
                                    <button onClick={() => { setPage('home'); setView('dashboard'); }} className="hover:text-agri-gold transition-colors flex items-center space-x-1">
                                        <div className="w-4 h-4"><Icons.HomeIcon /></div>
                                        <span>Home</span>
                                    </button>
                                    <button onClick={() => { if (user) { setPage('predict'); setView('dashboard'); } else setView('auth'); }} className="hover:text-agri-gold transition-colors flex items-center space-x-1">
                                        <div className="w-4 h-4"><Icons.BarChart3 /></div>
                                        <span>Predict</span>
                                    </button>
                                </nav>

                                <div className="flex items-center space-x-4">
                                    {user ? (
                                        <div className="flex items-center space-x-4">
                                            <span className="text-sm hidden sm:inline opacity-80">{user.name}</span>
                                            <button onClick={handleLogout} title="Sign Out" className="p-2 hover:bg-white/10 rounded-full transition-colors text-agri-gold">
                                                <div className="w-5 h-5"><Icons.LogOut /></div>
                                            </button>
                                        </div>
                                    ) : (
                                        <button onClick={() => setView('auth')} className="px-4 py-1.5 rounded-full border border-white/30 hover:bg-white/10 transition-all text-sm font-medium">
                                            Sign In
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'auth' ? (
                            <AuthView onAuthSuccess={(u) => { setUser(u); setView('dashboard'); setPage('predict'); }} />
                        ) : (
                            page === 'home' ? <HomeView onStart={() => { if (user) { setPage('predict'); setView('dashboard'); } else setView('auth'); }} /> : <PredictorView />
                        )}
                    </main>

                    <footer className="bg-stone-900 text-stone-400 py-8">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <div className="flex justify-center items-center space-x-2 mb-4">
                                <div className="w-6 h-6 text-agri-gold"><Icons.Sprout /></div>
                                <span className="text-lg font-serif font-bold text-white">AgriPredict</span>
                            </div>
                            <p className="text-sm">Empowering farmers with AI-driven insights for a sustainable future.</p>
                            <p className="text-xs mt-4">© 2026 AgriPredict. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const AuthView = ({ onAuthSuccess }) => {
            const [mode, setMode] = useState('signin');
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({ firstName: '', lastName: '', email: '', otp: '', password: '', confirmPassword: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState(window.FLASK_MESSAGE || '');
            const [timer, setTimer] = useState(0);
            const timerRef = useRef(null);

            useEffect(() => {
                if (timer > 0) {
                    timerRef.current = setTimeout(() => setTimer(timer - 1), 1000);
                }
                return () => clearTimeout(timerRef.current);
            }, [timer]);

            const checkEmail = async (e) => {
                if (e) e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const res = await fetch('/auth/check-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: formData.email })
                    });
                    const data = await res.json();
                    if (data.exists && mode === 'signup') {
                        setError('Email already registered. Please sign in.');
                    } else if (!data.exists && mode === 'signin') {
                        setError('Email not found. Please sign up.');
                    } else if (mode === 'signup') {
                        handleSendOTP();
                    } else {
                        handleSubmit();
                    }
                } catch (e) { setError('Connection error.'); }
                finally { setLoading(false); }
            };

            const handleSendOTP = async () => {
                setLoading(true);
                setError('');
                try {
                    const res = await fetch('/auth/send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: formData.email })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setStep(2);
                        setTimer(120); // 2 minutes
                        setSuccessMsg('Branded OTP sent to your inbox!');
                        setTimeout(() => setSuccessMsg(''), 5000);
                    } else { setError(data.message); }
                } catch (e) { setError('Failed to send OTP.'); }
                finally { setLoading(false); }
            };

            const handleResend = async () => {
                if (timer > 0) return;
                setLoading(true);
                try {
                    const res = await fetch('/auth/resend-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: formData.email })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setTimer(120);
                        setSuccessMsg('New OTP sent successfully!');
                        setTimeout(() => setSuccessMsg(''), 5000);
                    } else { setError(data.message); }
                } catch (e) { setError('Failed to resend.'); }
                finally { setLoading(false); }
            };

            const verifyOTP = async () => {
                setLoading(true);
                try {
                    const res = await fetch('/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: formData.email, otp: formData.otp })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setStep(3);
                    } else { setError(data.message); }
                } catch (e) { setError('Verification failed.'); }
                finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                if (e) e.preventDefault();
                if (mode === 'signup' && step === 3) {
                    if (formData.password !== formData.confirmPassword) {
                        setError('Passwords do not match.');
                        return;
                    }
                    if (!formData.password) {
                        setError('Password is required.');
                        return;
                    }
                }

                setLoading(true);
                setError('');
                let url, body;

                if (mode === 'forgot_password') {
                    if (step === 1) {
                        url = '/auth/forgot-password';
                        body = { email: formData.email };
                    } else if (step === 3) {
                        url = '/auth/reset-password';
                        body = { email: formData.email, otp: formData.otp, password: formData.password };
                    }
                } else {
                    url = mode === 'signup' ? '/auth/signup' : '/auth/signin';
                    body = mode === 'signup' ? {
                        first_name: formData.firstName,
                        last_name: formData.lastName,
                        email: formData.email,
                        otp: formData.otp,
                        password: formData.password
                    } : {
                        email: formData.email,
                        password: formData.password
                    };
                }

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (data.success) {
                        if (mode === 'forgot_password' && step === 1) {
                            setStep(2);
                            setTimer(120);
                            setSuccessMsg(data.message);
                        } else if (mode === 'forgot_password' && step === 3) {
                            setMode('signin');
                            setStep(1);
                            setSuccessMsg(data.message);
                        } else {
                            onAuthSuccess(data.user);
                        }
                    } else { setError(data.message); }
                } catch (e) { setError('Submission failed.'); }
                finally { setLoading(false); }
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            return (
                <div className="min-h-[80vh] flex items-center justify-center px-4 py-12">
                    <div className="max-w-md w-full glass p-8 rounded-3xl shadow-2xl space-y-8 relative overflow-hidden">
                        <div className="text-center relative z-10">
                            <div className="mx-auto h-12 w-12 text-agri-green mb-4"><div className="w-12 h-12"><Icons.ShieldCheck /></div></div>
                            <h2 className="text-3xl font-serif font-bold text-stone-900">
                                {mode === 'signin' ? 'Welcome Back' : mode === 'signup' ? 'Create Account' : 'Recover Account'}
                            </h2>
                            <p className="text-stone-500 mt-2">
                                {mode === 'signin' ? 'Sign in to access your dashboard' :
                                    mode === 'signup' ? 'Join AgriPredict and start forecasting' :
                                        'Reset your password to regain access'}
                            </p>
                        </div>

                        <form onSubmit={(e) => {
                            e.preventDefault();
                            if (mode === 'signin') handleSubmit(e);
                            else if (step === 1) checkEmail(e);
                            else if (step === 2) verifyOTP();
                            else handleSubmit(e);
                        }} className="space-y-6 relative z-10">
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm border border-red-100 flex items-center gap-2 animate-shake">
                                <div className="w-4 h-4 flex-shrink-0"><Icons.AlertCircle /></div> {error}
                            </div>}
                            {successMsg && <div className="bg-green-50 text-agri-green p-3 rounded-xl text-sm border border-green-100 flex items-center gap-2 animate-bounce">
                                <div className="w-4 h-4 flex-shrink-0"><Icons.CheckCircle2 /></div> {successMsg}
                            </div>}

                            {step === 1 && (
                                <>
                                    {mode === 'signup' && (
                                        <div className="grid grid-cols-2 gap-4">
                                            <FormInput label="First Name" value={formData.firstName} onChange={v => setFormData({ ...formData, firstName: v })} placeholder="John" />
                                            <FormInput label="Last Name" value={formData.lastName} onChange={v => setFormData({ ...formData, lastName: v })} placeholder="Doe" />
                                        </div>
                                    )}
                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-stone-700 flex items-center gap-2">
                                            <div className="w-4 h-4 text-agri-green"><Icons.Mail /></div> Email Address
                                        </label>
                                        <input type="email" required value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} className="w-full p-3 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-agri-green/20" placeholder="farmer@example.com" />
                                    </div>
                                    {mode === 'signin' && (
                                        <div className="space-y-4">
                                            <FormInput label="Password" type="password" value={formData.password} onChange={v => setFormData({ ...formData, password: v })} placeholder="••••••••" icon={<Icons.Lock />} />
                                            <div className="flex justify-end">
                                                <button type="button" onClick={() => { setMode('forgot_password'); setStep(1); setError(''); }} className="text-sm text-agri-gold hover:underline font-medium">Forgot Password?</button>
                                            </div>
                                        </div>
                                    )}
                                    <button type="submit" disabled={loading} className="w-full bg-agri-green text-white p-4 rounded-xl font-bold hover:bg-agri-green/90 transition-all flex items-center justify-center gap-2 shadow-lg hover:translate-y-[-2px]">
                                        {loading ? 'Processing...' : (mode === 'signup' ? 'Send OTP' : mode === 'forgot_password' ? 'Send Reset Code' : 'Sign In')}
                                        {!loading && <div className="w-5 h-5"><Icons.ArrowRight /></div>}
                                    </button>
                                    {mode === 'forgot_password' && (
                                        <button type="button" onClick={() => setMode('signin')} className="w-full text-sm text-stone-500 text-center hover:underline">Back to Sign In</button>
                                    )}
                                </>
                            )}

                            {step === 2 && (
                                <>
                                    <div className="space-y-4">
                                        <div className="text-center space-y-2">
                                            <label className="text-sm font-medium text-stone-700 block">Enter 6-digit Code</label>
                                            <input type="text" required maxLength="6" value={formData.otp} onChange={e => setFormData({ ...formData, otp: e.target.value })} className="w-full text-center text-4xl tracking-[0.5em] p-4 border-2 border-agri-green/20 rounded-2xl outline-none focus:border-agri-green focus:ring-4 focus:ring-agri-green/5 font-bold transition-all bg-white" placeholder="000000" />
                                        </div>

                                        <div className="flex flex-col items-center gap-3 py-2">
                                            {timer > 0 ? (
                                                <div className="flex items-center gap-2 text-agri-gold font-medium">
                                                    <div className="w-4 h-4 animate-spin"><Icons.RefreshCw /></div>
                                                    Resend in {formatTime(timer)}
                                                </div>
                                            ) : (
                                                <button type="button" onClick={handleResend} className="text-agri-green font-bold hover:underline flex items-center gap-2">
                                                    <div className="w-4 h-4"><Icons.RefreshCw /></div> Resend Verification Code
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-agri-green text-white p-4 rounded-xl font-bold hover:bg-agri-green/90 shadow-lg">
                                        {loading ? 'Verifying...' : 'Continue'}
                                    </button>
                                    <button type="button" onClick={() => setStep(1)} className="w-full text-sm text-stone-500 hover:text-agri-green text-center">Wrong email?</button>
                                </>
                            )}

                            {step === 3 && (
                                <>
                                    <div className="bg-agri-cream p-4 rounded-2xl border border-agri-green/10 flex items-center gap-3 mb-4">
                                        <div className="w-10 h-10 bg-agri-green text-white rounded-full flex items-center justify-center font-bold">3</div>
                                        <div>
                                            <p className="font-bold text-stone-800">{mode === 'signup' ? 'Final Step' : 'New Password'}</p>
                                            <p className="text-xs text-stone-500">Secure your AgriPredict account</p>
                                        </div>
                                    </div>
                                    <FormInput label="New Password" type="password" value={formData.password} onChange={v => setFormData({ ...formData, password: v })} placeholder="••••••••" icon={<Icons.Lock />} />
                                    <FormInput label="Confirm New Password" type="password" value={formData.confirmPassword} onChange={v => setFormData({ ...formData, confirmPassword: v })} placeholder="••••••••" icon={<Icons.Lock />} />

                                    <div className="space-y-2 py-2">
                                        <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Security Requirements:</p>
                                        <ul className="text-xs space-y-1">
                                            <li className={`flex items-center gap-2 ${formData.password.length >= 6 ? 'text-agri-green' : 'text-stone-400'}`}>
                                                <div className="w-3 h-3"><Icons.CheckCircle2 /></div> At least 6 characters
                                            </li>
                                            <li className={`flex items-center gap-2 ${/\d/.test(formData.password) ? 'text-agri-green' : 'text-stone-400'}`}>
                                                <div className="w-3 h-3"><Icons.CheckCircle2 /></div> At least one number
                                            </li>
                                            <li className={`flex items-center gap-2 ${/[!@#$%^&*()\-=_+]/.test(formData.password) ? 'text-agri-green' : 'text-stone-400'}`}>
                                                <div className="w-3 h-3"><Icons.CheckCircle2 /></div> At least one special character
                                            </li>
                                        </ul>
                                    </div>

                                    <button type="submit" disabled={loading} className="w-full bg-agri-green text-white p-4 rounded-xl font-bold hover:bg-agri-green/90 shadow-lg mt-2">
                                        {loading ? 'Finalizing...' : (mode === 'signup' ? 'Complete Sign Up' : 'Reset Password')}
                                    </button>
                                </>
                            )}
                        </form>

                        <div className="text-center pt-6 border-t border-stone-100 relative z-10">
                            <button onClick={() => { setMode(mode === 'signin' ? 'signup' : 'signin'); setStep(1); setError(''); }} className="text-sm font-medium text-stone-500 hover:text-agri-green transition-colors">
                                {mode === 'signin' ? "New here? Create an account" : "Already registered? Sign in"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const HomeView = ({ onStart }) => {
            return (
                <div className="space-y-20 pb-20">
                    <section className="relative h-[80vh] flex items-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img
                                src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=2000"
                                className="w-full h-full object-cover brightness-50"
                            />
                        </div>
                        <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-white">
                            <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }} className="max-w-2xl">
                                <h1 className="text-5xl sm:text-7xl font-serif font-bold leading-tight mb-6">
                                    Predicting the <span className="text-agri-gold italic">Future</span> of Your Harvest
                                </h1>
                                <p className="text-xl text-stone-200 mb-8 leading-relaxed">
                                    AgriPredict uses advanced AI to analyze soil, weather, and crop data, providing you with precision yield estimates and actionable farming advice.
                                </p>
                                <div className="flex flex-wrap gap-4">
                                    <button onClick={onStart} className="px-8 py-3 rounded-full font-bold transition-all flex items-center bg-agri-green text-white hover:bg-agri-green/90 shadow-lg">
                                        Get Started <div className="ml-2 w-5 h-5"><Icons.ArrowRight /></div>
                                    </button>
                                </div>
                            </motion.div>
                        </div>
                    </section>

                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-serif font-bold text-stone-900 mb-4">Why AgriPredict?</h2>
                            <div className="w-24 h-1 bg-agri-gold mx-auto"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                            <FeatureCard icon={<Icons.Zap />} title="Real-time Analysis" description="Get instant yield predictions based on current environmental factors." />
                            <FeatureCard icon={<Icons.ShieldCheck />} title="Data-Driven Decisions" description="Reduce risks by making informed choices about planting." />
                            <FeatureCard icon={<Icons.Globe />} title="Global Insights" description="Our models are trained on diverse agricultural datasets." />
                        </div>
                    </section>
                </div>
            );
        };

        const FeatureCard = ({ icon, title, description }) => (
            <div className="bg-white p-8 rounded-2xl shadow-sm border border-stone-100 hover:shadow-md transition-shadow text-center">
                <div className="bg-agri-cream w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 text-agri-gold">
                    <div className="w-8 h-8">{icon}</div>
                </div>
                <h3 className="text-xl font-serif font-bold text-stone-900 mb-3">{title}</h3>
                <p className="text-stone-600 leading-relaxed">{description}</p>
            </div>
        );

        const PredictorView = () => {
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [formData, setFormData] = useState({
                cropType: CROP_TYPES[0],
                soilType: SOIL_TYPES[0],
                region: REGIONS[0],
                rainfall: 500,
                temperature: 25,
                irrigationUsed: 'Used',
                daysToHarvest: 120
            });

            useEffect(() => { lucide.createIcons(); }, [result]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const response = await fetch('/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData),
                    });
                    const data = await response.json();
                    if (data.success) {
                        setResult(data);
                    } else {
                        alert("Error: " + data.error);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Error connecting to server.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-8">
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                        <div className="space-y-8">
                            <div>
                                <h2 className="text-3xl font-serif font-bold text-stone-900 mb-2">Yield Predictor</h2>
                                <p className="text-stone-600">Enter your farm details to get AI-powered yield estimates.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <FormSelect label="Crop Type" icon={<Icons.Wheat />} value={formData.cropType} onChange={v => setFormData({ ...formData, cropType: v })} options={CROP_TYPES} />
                                    <FormSelect label="Soil Type" icon={<Icons.Layers />} value={formData.soilType} onChange={v => setFormData({ ...formData, soilType: v })} options={SOIL_TYPES} />
                                    <FormSelect label="Region" icon={<Icons.MapPin />} value={formData.region} onChange={v => setFormData({ ...formData, region: v })} options={REGIONS} />
                                    <FormInput label="Rainfall (mm)" icon={<Icons.Droplets />} type="number" value={formData.rainfall} onChange={v => setFormData({ ...formData, rainfall: Number(v) })} />
                                    <FormInput label="Temp (°C)" icon={<Icons.Thermometer />} type="number" value={formData.temperature} onChange={v => setFormData({ ...formData, temperature: Number(v) })} />
                                    <FormSelect label="Irrigation" icon={<Icons.Activity />} value={formData.irrigationUsed} onChange={v => setFormData({ ...formData, irrigationUsed: v })} options={['Used', 'Not Used']} />
                                    <FormInput label="Days to Harvest" icon={<Icons.Clock />} type="number" value={formData.daysToHarvest} onChange={v => setFormData({ ...formData, daysToHarvest: Number(v) })} />
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-agri-green text-white p-3 rounded-xl font-bold hover:bg-agri-green/90 disabled:opacity-50 transition-all">
                                    {loading ? 'Processing...' : 'Run Prediction'}
                                </button>
                            </form>
                        </div>

                        <div className="relative">
                            {result ? (
                                <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-agri-green/20 h-full flex flex-col">
                                    <div className="flex items-center justify-between mb-8">
                                        <h3 className="text-2xl font-serif font-bold text-stone-900">Result</h3>
                                        <div className="bg-agri-green/10 text-agri-green px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                                            <div className="w-4 h-4"><Icons.CheckCircle2 /></div> AI Verified
                                        </div>
                                    </div>
                                    <div className="text-center mb-10">
                                        <div className="text-6xl font-serif font-bold text-agri-green mb-2">
                                            {result.predictedYield}
                                            <span className="text-2xl text-stone-400 font-sans ml-2">t/ha</span>
                                        </div>
                                        <p className="text-stone-500 uppercase tracking-widest text-sm font-bold">Estimated Yield</p>
                                    </div>
                                    <div className="bg-agri-cream p-4 rounded-xl mb-8">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-sm font-medium text-stone-600">Confidence</span>
                                            <span className="text-sm font-bold text-agri-green">{Math.round(result.confidence * 100)}%</span>
                                        </div>
                                        <div className="w-full bg-stone-200 rounded-full h-2">
                                            <div className="bg-agri-green h-2 rounded-full" style={{ width: `${result.confidence * 100}%` }}></div>
                                        </div>
                                    </div>
                                    <div className="space-y-4 flex-grow">
                                        <h4 className="font-bold text-stone-900 flex items-center gap-2">
                                            <div className="w-5 h-5 text-agri-gold"><Icons.AlertCircle /></div> Recommendations
                                        </h4>
                                        <ul className="space-y-3">
                                            {result.recommendations.map((rec, i) => (
                                                <li key={i} className="flex gap-3 text-stone-600 text-sm leading-relaxed">
                                                    <span className="bg-agri-gold/20 text-agri-gold h-5 w-5 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold">{i + 1}</span>
                                                    {rec}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <button onClick={() => setResult(null)} className="mt-8 w-full border-2 border-agri-green text-agri-green p-3 rounded-xl font-bold hover:bg-agri-green/10 transition-all">New Prediction</button>
                                </div>
                            ) : (
                                <div className="bg-agri-earth/5 border-2 border-dashed border-agri-earth/20 rounded-3xl h-full flex flex-col items-center justify-center p-12 text-center">
                                    <div className="bg-white p-6 rounded-full shadow-sm mb-6 text-agri-green opacity-20">
                                        <div className="w-16 h-16"><Icons.Sprout /></div>
                                    </div>
                                    <h3 className="text-xl font-serif font-bold text-stone-900 mb-2">Ready to Predict</h3>
                                    <p className="text-stone-500 max-w-xs">Fill out the form to see your predicted crop yield with accuracy.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FormSelect = ({ label, icon, value, onChange, options }) => (
            <div className="space-y-1">
                <label className="text-sm font-medium text-stone-700 flex items-center gap-2">
                    <div className="w-4 h-4 text-agri-green">{icon}</div> {label}
                </label>
                <select value={value} onChange={e => onChange(e.target.value)} className="w-full p-2 border border-stone-200 rounded-lg outline-none focus:ring-2 focus:ring-agri-green/20 transition-all">
                    {options.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
            </div>
        );

        const FormInput = ({ label, icon, type = "text", value, onChange, placeholder = "" }) => (
            <div className="space-y-1">
                <label className="text-sm font-medium text-stone-700 flex items-center gap-2">
                    <div className="w-4 h-4 text-agri-green">{icon}</div> {label}
                </label>
                <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} className="w-full p-3 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-agri-green/20 transition-all" />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        /* {% endraw %} */
    </script>
</body>

</html>
